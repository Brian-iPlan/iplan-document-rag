name: Weekly Keep-Alive Ping

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send GET request to Health Endpoint
        run: |
          echo "Sending keep-alive ping to Cloud Run health endpoint..."
          curl --fail --show-error --location "https://iplan-document-rag-v2-judpufgn7q-ew.a.run.app/health"
          echo -e "\nKeep-alive ping completed successfully."
