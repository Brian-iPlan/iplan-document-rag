steps:
  # Build: Point to the backend Dockerfile and use backend/ as the build context
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest", "-f", "backend/Dockerfile", "backend/"]

  # Push
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest"]

  # Deploy
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "$_IMAGE_NAME"
      - "--image"
      - "gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest"
      - "--region"
      - "europe-west1"
      - "--platform"
      - "managed"
      - "--quiet"

images:
  - "gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest"

substitutions:
  _IMAGE_NAME: "iplan-document-rag-v2"
