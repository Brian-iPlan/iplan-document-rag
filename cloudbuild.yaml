steps:
  # Build: Point to the backend Dockerfile and use backend/ as the build context
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/$_IMAGE_NAME:$BUILD_ID"
      - "-t"
      - "gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest"
      - "-f"
      - "backend/Dockerfile"
      - "backend/"

  # Push both tags
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "gcr.io/$PROJECT_ID/$_IMAGE_NAME"]

  # Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "$_IMAGE_NAME"
      - "--image"
      - "gcr.io/$PROJECT_ID/$_IMAGE_NAME:$BUILD_ID"
      - "--region"
      - "$_REGION"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--cpu"
      - "1"
      - "--memory"
      - "512Mi"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--timeout"
      - "300"
      - "--quiet"

images:
  - "gcr.io/$PROJECT_ID/$_IMAGE_NAME:$BUILD_ID"
  - "gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest"

substitutions:
  _IMAGE_NAME: "iplan-document-rag-v2"
  _REGION: "europe-west1"

options:
  logging: CLOUD_LOGGING_ONLY
